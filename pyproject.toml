[project]
name = "talx-to-stac"
version = "0.1.0"
description = "Map pretalx conference schedules to STAC Collections."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pystac>=1.11", "httpx>=0.27", "pyyaml>=6.0"]

[project.optional-dependencies]
youtube = ["yt-dlp>=2024.1"]
dev = [
  "yt-dlp>=2024.1",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "mypy>=1.11",
  "ruff>=0.6",
  "bandit>=1.7",
  "types-PyYAML",
  "types-yt-dlp",
  "jsonschema>=4.21",
  "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/talx_to_stac"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits the live network; deselected by default"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH", "RUF", "D", "ANN", "S"]
ignore = ["D107", "ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN", "S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false

[tool.bandit]
exclude_dirs = ["tests"]
